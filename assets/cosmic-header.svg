<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">V-iterates — a universe in progress</title>
<desc id="desc">A minimal midnight space banner with a subtle field of glowing squares and fine orbital arcs.</desc>
